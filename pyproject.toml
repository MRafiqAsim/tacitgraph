[project]
name = "tacitgraph"
version = "0.1.0"
description = "From PST to a knowledge RAG you can chat with. Structures unstructured expert knowledge from Outlook archives into a knowledge graph queried with GraphRAG, PathRAG, vector, hybrid and ReAct retrieval."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Muhammad Rafiq" }]
requires-python = ">=3.11,<3.13"
keywords = [
    "rag", "graphrag", "pathrag", "knowledge-graph", "retrieval-augmented-generation",
    "llm", "azure-openai", "local-llm", "outlook", "pst", "email", "enterprise-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Email",
]
dependencies = [
    "openai>=1.10",
    "tiktoken>=0.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "networkx>=3.2",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "nano-vectordb>=0.0.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.2",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "ftfy>=6.1",
    "langdetect>=1.0.9",
    "langid>=1.1.6",
    "gradio>=4.0",
    "pyvis>=0.3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Bronze layer: PST extraction and attachment/document parsing
ingest = [
    "libpff-python>=20231205",
    "extract-msg>=0.48",
    "pypdf>=3.17",
    "pymupdf>=1.23",
    "pdf2image>=1.16",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "striprtf>=0.0.26",
    "beautifulsoup4>=4.12",
    "msoffcrypto-tool>=5.0",
]
# Local NLP mode: spaCy NER, Presidio PII detection, local summarization/embeddings
nlp = [
    "spacy>=3.7",
    "presidio-analyzer>=2.2",
    "transformers>=4.36",
    "torch>=2.1",
    "sentence-transformers>=2.2",
]
# Optional Azure backends: AI Search vector index, Cosmos DB graph store
azure = [
    "azure-identity>=1.19",
    "azure-storage-file-datalake>=12.17",
    "azure-search-documents>=11.6.0b5",
    "azure-cosmos>=4.7",
    "gremlinpython>=3.7.2",
    "opencensus-ext-azure>=1.1",
]
# RAGAS evaluation
eval = ["ragas>=0.4"]
# Reference PathRAG implementation in tacitgraph.pathrag
pathrag = ["graspologic>=3.3"]
all = ["tacitgraph[ingest,nlp,azure,eval,pathrag]"]

[project.scripts]
tacitgraph-ingest = "tacitgraph.pipeline.run_ingestion:main"
tacitgraph-process = "tacitgraph.pipeline.run_thread_processing:main"
tacitgraph-index = "tacitgraph.pipeline.run_gold_indexing:main"
tacitgraph-query = "tacitgraph.pipeline.run_query:main"
tacitgraph-app = "tacitgraph.app:main"

[project.urls]
Homepage = "https://github.com/MRafiqAsim/tacitgraph"
Repository = "https://github.com/MRafiqAsim/tacitgraph"
Issues = "https://github.com/MRafiqAsim/tacitgraph/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

# spaCy models used by the local NLP mode (pinned to the installed spaCy 3.8 line):
#   uv sync --extra nlp --group models
models = [
    "en-core-web-trf",
    "en-core-web-lg",
    "nl-core-news-lg",
]

[tool.uv.sources]
en-core-web-trf = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.8.0/en_core_web_trf-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
nl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacitgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "synapse",
    "src/tacitgraph/pathrag",  # vendored third-party code (see THIRD_PARTY_LICENSE)
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
    "RUF001", "RUF002", "RUF003",  # unicode arrows/dashes in strings and comments are intentional
    "RUF012",   # class-level constant tables are not mutated; ClassVar adds noise
    "SIM102",   # nested ifs are kept where they read more clearly
    "SIM105",   # explicit try/except/pass is preferred over contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
# CLIs and the app load .env before importing modules that read settings at import time
"src/tacitgraph/pipeline/*.py" = ["E402"]
"src/tacitgraph/app.py" = ["E402"]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["tacitgraph"]
exclude = ["src/tacitgraph/pathrag/"]  # vendored third-party code
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

# Typing ratchet: modules below still have mypy errors and are being annotated
# incrementally. Remove a module once it type-checks cleanly; CI keeps every
# other module error-free.
[[tool.mypy.overrides]]
module = [
    "tacitgraph.app",
    "tacitgraph.bronze.attachment_processor",
    "tacitgraph.bronze.attachment_router",
    "tacitgraph.bronze.attachment_storage",
    "tacitgraph.bronze.bronze_loader",
    "tacitgraph.bronze.document_parser",
    "tacitgraph.bronze.pst_extractor",
    "tacitgraph.evaluation.anonymization_evaluator",
    "tacitgraph.evaluation.comparative_analysis",
    "tacitgraph.evaluation.pipeline_comparator",
    "tacitgraph.evaluation.ragas_evaluator",
    "tacitgraph.evaluation.summarization_metrics",
    "tacitgraph.gold.community_detector",
    "tacitgraph.gold.embedding_generator",
    "tacitgraph.gold.graph_builder",
    "tacitgraph.gold.path_indexer",
    "tacitgraph.pipeline.evaluate_privacy",
    "tacitgraph.pipeline.evaluate_quality",
    "tacitgraph.pipeline.run_build_catalog",
    "tacitgraph.pipeline.run_gold_indexing",
    "tacitgraph.pipeline.run_ingestion",
    "tacitgraph.pipeline.visualize_graph",
    "tacitgraph.retrieval.hybrid_retriever",
    "tacitgraph.retrieval.pathrag_retriever",
    "tacitgraph.retrieval.react_retriever",
    "tacitgraph.retrieval.retrieval_tools",
    "tacitgraph.retrieval.vector_search",
    "tacitgraph.settings",
    "tacitgraph.silver.anonymizer",
    "tacitgraph.silver.attachment_classifier",
    "tacitgraph.silver.chunker",
    "tacitgraph.silver.email_sensitivity_classifier",
    "tacitgraph.silver.identity_registry",
    "tacitgraph.silver.kg_entity_extractor",
    "tacitgraph.silver.openai_pii_detector",
    "tacitgraph.silver.openai_vision_extractor",
    "tacitgraph.silver.pii_detector",
    "tacitgraph.silver.privacy_metrics",
    "tacitgraph.silver.relationship_extractor",
    "tacitgraph.silver.silver_processor",
    "tacitgraph.silver.thread_aware_processor",
    "tacitgraph.silver.unified_processor",
    "tacitgraph.storage.cosmos_adapter",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs Azure credentials or large models (deselect with -m 'not integration')"]

[tool.coverage.run]
source = ["tacitgraph"]
branch = true
omit = ["*/tacitgraph/pathrag/*"]  # vendored third-party code
